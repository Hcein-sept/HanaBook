  body {
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;

  .card {

    width: 100%;

    text-align: center;
  }
  .logo {
    width: 48px;

    border-radius: 10px;

    justify-content: center;

  .logo svg { width: 24px; height: 24px; fill: #fff; }

  .section-label {

    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #9D8A9E;
    margin-bottom: 10px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 10px;
    transition: background 0.2s, transform 0.12s;
    font-family: 'Outfit', sans-serif;
  }
  .btn:active { transform: scale(0.985); }
  .btn-primary {
    background: #6B5B6E;
    color: #fff;
  }
  .btn-primary:hover { background: #5C4D5F; }
  .btn-secondary {
    background: #F0EAE5;
    color: #5C4D5F;
  }
  .btn-secondary:hover { background: #E8E0D9; }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .size-tag { font-size: 11px; font-weight: 400; opacity: 0.65; }
  .platform-group { margin-bottom: 18px; }
  .platform-group:last-child { margin-bottom: 0; }
  .divider {
    width: 40px; height: 1px; background: #DDD7D0;
    margin: 28px auto;
  }
  .footer {
    margin-top: 28px;
    font-size: 12px;
    color: #B0A8B0;
    line-height: 1.9;
    font-weight: 500;
  }
  .badge {
    display: inline-block;
    background: #F0EAE5;
    color: #6B5E6C;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 6px;
    letter-spacing: 0.3px;
  }
  .pwd-hint { font-size: 11px; color: #B0A8B0; margin-top: 2px; }
  @media (prefers-color-scheme: dark) {
    body {
      background: #1E1A1F;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(157,138,158,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(107,91,110,0.06) 0%, transparent 50%);
    }
    .card {
      background: #262227;
      border-color: #353035;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2), 0 8px 32px rgba(0,0,0,0.15);
    }
    h1 { color: #C4B5C7; }
    .sub { color: #B0A8B0; }
    .section-label { color: #9D8A9E; }
    .btn-primary { background: #9D8A9E; }
    .btn-primary:hover { background: #8B7A8C; }
    .btn-secondary { background: #2A252B; color: #B0A8B0; }
    .btn-secondary:hover { background: #322D33; }
    .divider { background: #3A353A; }
    .footer { color: #7A6E7A; }
    .badge { background: #2A252B; color: #9D8A9E; }
