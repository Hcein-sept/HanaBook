name: recallio
description: A local-first personal media log for anime, manga, novels, and games.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  archive: ^3.6.1
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  drift: ^2.24.0
  file_picker: ^11.0.2
  flutter_animate: ^4.5.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  image: ^4.3.0
  intl: any
  path: ^1.9.0
  path_provider: ^2.1.5
  sqlite3_flutter_libs: ^0.5.30
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.14
  drift_dev: ^2.24.0
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source: system
      name_windows: winsqlite3
      name: sqlite3
